services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      AI_SERVICE_URL: http://ai-service:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - ai-service

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    expose:
      - "8000"

  web:
    build:
      context: ./frontend/frontend
      dockerfile: web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
