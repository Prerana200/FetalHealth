name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Run tests with coverage
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
        run: python -m pytest -q --cov=main --cov=models --cov=database --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_USE_MOCK: "true"

  contract-smoke:
    name: Backend contract smoke test (mock AI)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pillow httpx
      - name: Start mock AI service and backend
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          AI_SERVICE_URL: http://127.0.0.1:8001
        run: |
          (cd mock_ai_service && nohup uvicorn main:app --port 8001 > /tmp/ai.log 2>&1 &)
          (cd backend && nohup uvicorn main:app --port 8000 > /tmp/be.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done
      - name: Run smoke test
        # The mock AI returns the old class names, so the "Small/Medium/Large" check is expected to fail.
        run: |
          python tests/backend_smoke.py | tee /tmp/smoke.txt || true
          ! grep "^FAIL" /tmp/smoke.txt | grep -v "classes are Small/Medium/Large"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fetal-backend ./backend
      - run: docker build -t fetal-ai-service ./ai-service